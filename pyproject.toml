[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euoracraft-launcher"
version = "0.1.0-dev"
description = "EuoraCraft Launcher - pytauri edition"
authors = [
    {name = "ECLTeam", email = "eclteam@eclteam.freeqiye.com"},
]
requires-python = ">=3.11"
dependencies = [
    "pytauri>=0.8",
    "colorama>=0.4.0",
    "requests",
    "pyperclip",
    "cryptography>=42.0.0",
    "keyring>=24.0.0",
    "keyrings-alt>=4.0.0",
    "msal>=1.20.0",
    "Pillow>=10.0.0",
    "anyio",
    "pydantic>=2.0",
]

[project.entry-points.pytauri]
ext_mod = "euoracraft_launcher._pytauri_ext"

[tool.setuptools.packages.find]
where = ["python"]
include = ["python*"]
